# Ask Me Anything: the card deck
#
# Each card is one conversation starter. The answer isn't the point;
# the good stuff is wherever the conversation wanders next.
#
# Fields:
#   vibe:     whimsical | deep | nerdy | spicy   (sets the card's color & sticker)
#   fact:     (optional) a fun fact or bit of trivia shown above the question
#   question: the main prompt (required)
#   nudge:    (optional) a follow-up to keep things rolling
#
# Tip: if a line contains a colon, wrap it in quotes or use the `>-` style below.
#
# Deck balance: 30% whimsical, 30% nerdy, 20% deep, 20% spicy.

# ---------------------------------------------------------------------------
